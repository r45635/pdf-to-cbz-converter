[package]
name = "pdf-to-cbz-converter"
version = "2.5.0"
description = "PDF to CBZ Converter - Desktop Application"
authors = ["Vincent Cruvellier"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pdf_to_cbz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# PDF Processing
pdfium-render = "0.8"

# Image Processing
image = { version = "0.25", features = ["jpeg", "png"] }

# Archive Operations
zip = { version = "2.2", features = ["deflate"] }

# PDF Creation (for CBZ to PDF conversion)
printpdf = "0.7"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rayon = "1.10"  # For parallel processing

