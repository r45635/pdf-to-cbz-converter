name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.0.0, etc.
  workflow_dispatch:  # Allows manual trigger from GitHub UI
    inputs:
      version:
        description: 'Version number (e.g., v2.1.0)'
        required: true
        default: 'v2.1.0'
      create_release:
        description: 'Create GitHub release'
        required: false
        default: true
        type: boolean

# Grant GITHUB_TOKEN the permissions required for this workflow
permissions:
  contents: write
  pull-requests: read

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set version
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $VERSION = "${{ github.event.inputs.version }}"
        } else {
          $VERSION = "${{ github.ref_name }}"
        }
        echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        echo "Building version: $VERSION"
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      working-directory: pdf-to-cbz-python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Windows executables with version info
      working-directory: pdf-to-cbz-python
      run: |
        # Build CLI version with version info
        pyinstaller --onefile --distpath=dist --workpath=build --clean --name=pdf_to_cbz_cli --version-file=version_info.txt --collect-all fitz pdf_to_cbz.py

        # Build GUI version with version info
        pyinstaller --onefile --distpath=dist --workpath=build --clean --name=pdf_to_cbz_gui --windowed --version-file=version_info.txt --collect-all fitz pdf_to_cbz_gui.py

    - name: Create Windows package
      run: |
        $VERSION = "${{ steps.version.outputs.VERSION }}"
        # Create release directory structure
        New-Item -ItemType Directory -Force -Path "release\pdf_to_cbz_${VERSION}_windows"

        # Copy executables
        Copy-Item "pdf-to-cbz-python\dist\pdf_to_cbz_cli.exe" "release\pdf_to_cbz_${VERSION}_windows\"
        Copy-Item "pdf-to-cbz-python\dist\pdf_to_cbz_gui.exe" "release\pdf_to_cbz_${VERSION}_windows\"

        # Copy documentation and essential files
        Copy-Item "pdf-to-cbz-python\README.md" "release\pdf_to_cbz_${VERSION}_windows\"
        Copy-Item "pdf-to-cbz-python\ENHANCED_FEATURES.md" "release\pdf_to_cbz_${VERSION}_windows\" -ErrorAction SilentlyContinue
        Copy-Item "pdf-to-cbz-python\QUICK_START.md" "release\pdf_to_cbz_${VERSION}_windows\" -ErrorAction SilentlyContinue
        Copy-Item "pdf-to-cbz-python\CHANGELOG.md" "release\pdf_to_cbz_${VERSION}_windows\"
        Copy-Item "pdf-to-cbz-python\RELEASE_NOTES.md" "release\pdf_to_cbz_${VERSION}_windows\" -ErrorAction SilentlyContinue
        Copy-Item "LICENSE" "release\pdf_to_cbz_${VERSION}_windows\"
        Copy-Item "pdf-to-cbz-python\requirements.txt" "release\pdf_to_cbz_${VERSION}_windows\"

        # Copy sample directory if it exists
        if (Test-Path "sample_dir") {
          Copy-Item "sample_dir" "release\pdf_to_cbz_${VERSION}_windows\" -Recurse
        }

        # Create ZIP package
        Compress-Archive -Path "release\pdf_to_cbz_${VERSION}_windows\*" -DestinationPath "pdf_to_cbz_${VERSION}_windows.zip"
        
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: pdf_to_cbz_v*.zip

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${{ github.ref_name }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: pdf-to-cbz-python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build macOS executables with version info
      working-directory: pdf-to-cbz-python
      run: |
        # Build CLI version with version info
        pyinstaller --onefile --distpath=dist --workpath=build --clean --name=pdf_to_cbz_cli --version-file=version_info.txt --collect-all fitz pdf_to_cbz.py

        # Build GUI version with version info
        pyinstaller --onefile --distpath=dist --workpath=build --clean --name=pdf_to_cbz_gui --windowed --version-file=version_info.txt --collect-all fitz pdf_to_cbz_gui.py

    - name: Create macOS package
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        # Create release directory structure
        mkdir -p "release/pdf_to_cbz_${VERSION}_macos"

        # Copy executables
        cp "pdf-to-cbz-python/dist/pdf_to_cbz_cli" "release/pdf_to_cbz_${VERSION}_macos/"
        # GUI is an .app bundle on macOS; copy recursively
        cp -R "pdf-to-cbz-python/dist/pdf_to_cbz_gui.app" "release/pdf_to_cbz_${VERSION}_macos/"

        # Copy documentation and essential files
        cp pdf-to-cbz-python/README.md "release/pdf_to_cbz_${VERSION}_macos/" 2>/dev/null || true
        cp pdf-to-cbz-python/ENHANCED_FEATURES.md "release/pdf_to_cbz_${VERSION}_macos/" 2>/dev/null || true
        cp pdf-to-cbz-python/QUICK_START.md "release/pdf_to_cbz_${VERSION}_macos/" 2>/dev/null || true
        cp pdf-to-cbz-python/CHANGELOG.md "release/pdf_to_cbz_${VERSION}_macos/" 2>/dev/null || true
        cp pdf-to-cbz-python/RELEASE_NOTES.md "release/pdf_to_cbz_${VERSION}_macos/" 2>/dev/null || true
        cp LICENSE "release/pdf_to_cbz_${VERSION}_macos/" 2>/dev/null || true
        cp pdf-to-cbz-python/requirements.txt "release/pdf_to_cbz_${VERSION}_macos/" 2>/dev/null || true

        # Copy sample directory if it exists
        if [ -d "sample_dir" ]; then
          cp -r sample_dir "release/pdf_to_cbz_${VERSION}_macos/"
        fi

        # Create ZIP package
        (cd release && zip -r "../pdf_to_cbz_${VERSION}_macos.zip" "pdf_to_cbz_${VERSION}_macos/")

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: pdf_to_cbz_v*_macos.zip

  build-docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${{ github.ref_name }}"
        fi
        # Remove 'v' prefix for Docker tag
        VERSION_NUM="${VERSION#v}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "VERSION_NUM=$VERSION_NUM" >> $GITHUB_OUTPUT
        echo "Building Docker version: $VERSION_NUM"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./pdf-to-cbz-nextjs
        push: true
        tags: |
          r45635/pdf-to-cbz:latest
          r45635/pdf-to-cbz:${{ steps.version.outputs.VERSION_NUM }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-source:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${{ github.ref_name }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Create source package
      run: |
        # Get version from previous step
        VERSION="${{ steps.version.outputs.VERSION }}"

        # Create source directory structure
        mkdir -p release/pdf_to_cbz_${VERSION}_source

        # Copy source files from pdf-to-cbz-python/ (exclude build artifacts and caches)
        cp -r pdf-to-cbz-python/*.py release/pdf_to_cbz_${VERSION}_source/ 2>/dev/null || true
        cp pdf-to-cbz-python/requirements.txt release/pdf_to_cbz_${VERSION}_source/
        cp pdf-to-cbz-python/*.md release/pdf_to_cbz_${VERSION}_source/ 2>/dev/null || true
        cp LICENSE release/pdf_to_cbz_${VERSION}_source/ 2>/dev/null || true
        cp pdf-to-cbz-python/*.spec release/pdf_to_cbz_${VERSION}_source/ 2>/dev/null || true
        cp pdf-to-cbz-python/*.bat release/pdf_to_cbz_${VERSION}_source/ 2>/dev/null || true
        cp pdf-to-cbz-python/*.ps1 release/pdf_to_cbz_${VERSION}_source/ 2>/dev/null || true
        cp pdf-to-cbz-python/version_info.txt release/pdf_to_cbz_${VERSION}_source/ 2>/dev/null || true

        # Create sample directory if it exists
        if [ -d "sample_dir" ]; then
          cp -r sample_dir release/pdf_to_cbz_${VERSION}_source/
        fi

        # Create ZIP and tar.gz packages
        cd release
        zip -r ../pdf_to_cbz_${VERSION}_source.zip pdf_to_cbz_${VERSION}_source/
        tar -czf ../pdf_to_cbz_${VERSION}_source.tar.gz pdf_to_cbz_${VERSION}_source/
        
    - name: Upload source artifacts
      uses: actions/upload-artifact@v4
      with:
        name: source-build
        path: |
          pdf_to_cbz_v*.zip
          pdf_to_cbz_v*.tar.gz
          pdf_to_cbz_v*.zip
          pdf_to_cbz_v*.tar.gz

  create-release:
    needs: [build-windows, build-macos, build-source, build-docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${{ github.ref_name }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Creating release for version: $VERSION"
      
    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-build
        
    - name: Download macOS artifacts
      uses: actions/download-artifact@v4
      with:
        name: macos-build
        
    - name: Download source artifacts
      uses: actions/download-artifact@v4
      with:
        name: source-build
        
    - name: Generate release notes
      id: release_notes
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"

        # Read release notes from files if they exist, otherwise create generic ones
        if [ -f "pdf-to-cbz-python/RELEASE_NOTES.md" ]; then
          NOTES=$(cat pdf-to-cbz-python/RELEASE_NOTES.md)
        else
          NOTES="## PDF to CBZ Converter ${VERSION}

        ### 🚀 What's New in v2.1.0
        - **Enhanced Preview System**: Always-visible zoom controls with fixed-size areas
        - **Smart Zoom Modes**: Normal/Puissant/Ultra levels with keyboard shortcuts (1/2/3)
        - **Auto-Updating Preview**: Real-time updates on settings changes and window resize
        - **Settings Transfer**: Apply preview settings to main GUI with one click
        - **Protected Info Bar**: Always-visible size metrics that never get overlapped
        - **Improved Layout**: Compact controls and better visual hierarchy
        
        ### 📦 Downloads
        - **Windows Users**: Download the Windows package below (includes both CLI and GUI executables)
        - **Developers/Other Platforms**: Download the source package
        
        ### 🚀 Installation
        - **Windows**: Extract the ZIP file and run the executables directly - no Python installation required!
        - **Other platforms**: Extract source and run with Python 3.11+ (see requirements.txt)
        
        ### 📚 Documentation
        For detailed documentation, see the included README.md and ENHANCED_FEATURES.md files.
        
        ### 🔄 Upgrade Notes
        This release maintains full backward compatibility with v2.0.0 configurations and workflows."
        fi
        
        # Save to environment for GitHub release
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
        echo "$NOTES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Check and cleanup existing release
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        
        # Check if release exists and delete it if it does
        if gh release view "$VERSION" > /dev/null 2>&1; then
          echo "Release $VERSION already exists. Deleting it..."
          gh release delete "$VERSION" --yes || echo "Failed to delete existing release"
        fi
        
        # Check if tag exists and delete it if it does
        if git rev-parse --verify "refs/tags/$VERSION" > /dev/null 2>&1; then
          echo "Tag $VERSION already exists. Deleting it..."
          git tag -d "$VERSION" || echo "Failed to delete local tag"
          git push --delete origin "$VERSION" || echo "Failed to delete remote tag"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: PDF to CBZ Converter ${{ steps.version.outputs.VERSION }}
        body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
        files: |
          pdf_to_cbz_v*_windows.zip
          pdf_to_cbz_v*_macos.zip
          pdf_to_cbz_v*_source.zip
          pdf_to_cbz_v*_source.tar.gz
        draft: false
        prerelease: false
        make_latest: true
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
